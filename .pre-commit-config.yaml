repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^(03_analysis|syreto)/tests/fixtures/python_source_guard_broken/
      - id: ruff-format
        exclude: ^(03_analysis|syreto)/tests/fixtures/python_source_guard_broken/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^(03_analysis|syreto)/tests/fixtures/python_source_guard_broken/
      - id: trailing-whitespace
        # The vendor standard must retain its pinned byte identity.
        exclude: ^((03_analysis|syreto)/tests/fixtures/python_source_guard_broken/|docs/standards/AGENT_EXECUTION_DISCIPLINE_v1\.1\.md$)
      - id: check-merge-conflict
      - id: check-added-large-files
